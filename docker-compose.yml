version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shadowling_postgres
    environment:
      POSTGRES_DB: shadowling
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shadowling_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
