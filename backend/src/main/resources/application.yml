spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shadowling}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:shadowling-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${PORT:8080}
  error:
    include-message: always
  tomcat:
    accesslog:
      enabled: true
      directory: ${user.home}
      prefix: shadowling-access

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

openai:
  api-key: ${OPENAI_API_KEY:}
  whisper-url: https://api.openai.com/v1/audio/transcriptions

azure:
  speech:
    key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:eastus}

logging:
  level:
    com.shadowling: INFO
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
